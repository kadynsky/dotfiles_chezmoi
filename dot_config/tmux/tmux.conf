# Better Prefix
unbind C-b
set -g prefix `
bind ` send-prefix
# Source default tmux config file keybind
bind R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "Config reloaded"

setw -g mode-keys vi

# 1-based window indexing
set -g base-index 1
set -g pane-base-index 1

# True colors support
set -g  default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

#QoL
set -g escape-time 0
set -g mouse on
set -g repeat-time 250
set -g history-limit 10000
set -g renumber-windows on
set -g status-position bottom
set -g focus-events on
set -g visual-activity on
set -g monitor-activity on

# Vim-Motions pane resizing
bind -r M-h resize-pane -L 2
bind -r M-j resize-pane -D 2
bind -r M-k resize-pane -U 2
bind -r M-l resize-pane -R 2

# Vim-motions pane switching
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
# Fix: Vim-motions pane switching occupy 'l' keybind, making it impossible to switch to last window
bind -r L last-window

# Main clipboard copying. Hit Prefix key, then Space, then select, than hit y key. The contents should be then copied into the main clipboard instead of tmux's.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Keybindings
bind | split-window -h
bind - split-window -v

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#tmux-ressurect 
#tmux-continuum

# set -g @plugin 'github_username/plugin_name'
#tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'

# Press Prefix + Alt-s to save tmux environment 
# then you shutdown tmux with kill-server command, for example. 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
